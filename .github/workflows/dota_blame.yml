name: Dota Blame Bot

on:
  schedule:
    # GitHub's cron minimum granularity is 5 minutes, but under load GitHub
    # can delay scheduled runs by several minutes - don't expect exact timing.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the job can commit the updated state.json back

concurrency:
  group: dota-blame-bot
  cancel-in-progress: false   # never cancel a run that might be mid-way through a commit

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          STEAM_ACCOUNT_ID: ${{ secrets.STEAM_ACCOUNT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
        run: python dota_blame_bot.py

      - name: Commit updated state
        run: |
          git config user.name "dota-blame-bot"
          git config user.email "actions@users.noreply.github.com"

          # Make sure we're up to date with the remote first.
          git pull --rebase origin main

          # Stage the updated state file.
          git add state.json

          # Only commit if state.json actually changed.
          if ! git diff --cached --quiet; then
            git commit -m "Update state [skip ci]"
            git push origin HEAD:main
          else
            echo "No state changes to commit."
          fi
